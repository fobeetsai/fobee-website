function renderLabs(){const info={pressure:['前方的土，為什麼需要支撐？','想像土和水從左邊往洞裡推，機器從右邊提供支撐。拖曳看看兩邊的相對關係。這個模型沒有壓力、速度或任何實機設定值。'],stagger:['接縫錯開，到底是什麼意思？','把圓形環片環帶想像攤平，比較每一環接縫的位置。像砌磚一樣，看看接縫有沒有連成直線。'],grout:['背填填的是外面，不是隧道裡面。','綠色是環片，外側留有空隙。拖曳滑桿，看橘色材料填進哪裡；白色中央空間始終留給隧道使用。']}[lab];return title('TRY A SIMPLE MODEL','動手拖一拖，原理就看得見。','不用背一堆數字。先理解支撐、錯縫與背填各自在做什麼。','3 個互動圖解')+`<div class="labs-tabs"><button data-lab="pressure" class="${lab==='pressure'?'active':''}">01 前方支撐</button><button data-lab="stagger" class="${lab==='stagger'?'active':''}">02 接縫錯開</button><button data-lab="grout" class="${lab==='grout'?'active':''}">03 外側空隙</button></div><section class="surface lab-layout"><div class="lab-graphic" id="lab-graphic"></div><div class="lab-copy"><span class="eyebrow">CONCEPT LAB / ${lab==='pressure'?'01':lab==='stagger'?'02':'03'}</span><h3>${info[0]}</h3><p>${info[1]}</p><p class="jp">${D.labJp?.[lab]||""}</p><div class="lab-controls">${lab==='pressure'?`<label class="range-label" for="pressure-slider">概念支撐程度 <output id="pressure-output"></output></label><input id="pressure-slider" type="range" min="0" max="100" value="${pressure}" aria-label="概念支撐程度"><div class="range-extents"><span>較少</span><span>較多</span></div>`:lab==='stagger'?`<div class="seg-toggle"><button data-stagger="false" class="${!stagger?'active':''}">接縫對齊</button><button data-stagger="true" class="${stagger?'active':''}">接縫錯開</button></div>`:`<label class="range-label" for="grout-slider">拖曳查看填補過程 <span>動畫進度</span></label><input id="grout-slider" type="range" min="0" max="100" value="${grout}" aria-label="填補動畫進度"><div class="range-extents"><span>還有空隙</span><span>示意填補完成</span></div>`}<div id="lab-status" class="lab-status" aria-live="polite"></div></div>${lab==='grout'?'<div class="legend"><span><i></i>背填漿材</span><span><i class="teal"></i>環片</span></div>':''}</div></section>${notice('小實驗只說明概念，沒有實機設定功能。不能用滑桿位置決定艙壓、注入壓力、注入量或施工配置。')}`}

function renderQuiz(){const list=quizMode==='beginner'?D.beginner:D.quizzes;quizIndex=Math.max(0,Math.min(list.length-1,quizIndex));const q=list[quizIndex],choice=S.answers[q.id],answered=Number.isInteger(choice)&&choice>=0&&choice<4,correct=choice===q.answer;return title('CHECK YOUR UNDERSTANDING','懂了多少，試著說說看。','先做白話概念題，再用長片教材題檢查術語與數值讀法。','即時解答＋學習紀錄')+`<div class="quiz-wrap"><div class="quiz-modes"><button data-quiz-mode="beginner" class="${quizMode==='beginner'?'active':''}">先懂原理 · 5 題<small>用生活比喻確認你真的懂了</small></button><button data-quiz-mode="video" class="${quizMode==='video'?'active':''}">長片複習 · 10 題<small>依教材例值作答，非實機操作標準</small></button></div><div class="quiz-dots">${list.map((t,i)=>`<button data-question="${i}" aria-label="第 ${i+1} 題" class="${i===quizIndex?'active ':''}${S.answers[t.id]!==undefined?'done':''}">${i+1}</button>`).join('')}</div><section class="surface quiz-card"><div class="quiz-head"><span>問題 ${quizIndex+1} / ${list.length}</span><span>本組答對 ${list.filter(q=>S.answers[q.id]===q.answer).length} 題</span></div>${quizMode==='video'?'<span class="note-tag">以下是閱讀理解選項，含錯誤答案，非施工指示</span>':''}<div class="quiz-question zh">${q.question.zhHtml||esc(q.question.zh)}</div><div class="quiz-question jp">${q.question.jpHtml||esc(q.question.jp)}</div><div class="quiz-options">${q.options.map((o,i)=>`<button data-answer="${i}" class="quiz-option ${answered?(i===q.answer?'correct':i===choice?'wrong':''):''}" ${answered?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><div><div class="zh">${o.zhHtml||esc(o.zh)}</div><div class="jp">${o.jpHtml||esc(o.jp)}</div></div></button>`).join('')}</div>${answered?`<div class="quiz-feedback ${correct?'':'wrong'}" role="status"><strong>${correct?'答對了！':'這題再想一下。'} 正確答案：${String.fromCharCode(65+q.answer)}</strong>${pair(q.explanation)}</div>`:'<p class="muted">選一個答案，查看中日解說。先想一想，不用急著猜。</p>'}<div class="quiz-controls"><button class="button secondary small" data-question="${Math.max(0,quizIndex-1)}" ${quizIndex===0?'disabled':''}>← 上一題</button>${answered?'<button class="text-link" data-action="retry-question">再做一次</button>':''}<button class="button small" data-question="${Math.min(list.length-1,quizIndex+1)}" ${quizIndex===list.length-1?'disabled':''}>下一題 →</button></div></section><section class="surface oral"><span class="eyebrow">SPEAK IN YOUR OWN WORDS</span><h3>用自己的話，再說一遍。</h3><details><summary>① 為什麼不能只看掘進速度？／速さだけを見てはいけないのはなぜですか。</summary><p>還要確認開挖面支撐、出土量、機器姿態與地盤反應。<span class="jp"> 切羽を支える力、排土量、機械の姿勢、地盤の変化も確認します。</span></p></details><details><summary>② 背填與滑材的目的，有什麼不同？／裏込め注入と滑材注入の目的の違いは何ですか。</summary><p>背填主要填補環片外側空隙；滑材主要降低推進管外周摩擦。<span class="jp"> 裏込め注入は外側のすき間を埋め、滑材注入は推進管の外側の摩擦を減らします。</span></p></details><details><summary>③ 發現壓力異常，回報時要說清什麼？／圧力の異常を報告するとき、何を伝えますか。</summary><p>說清位置、哪個設備、觀察到什麼變化，以及已依核定程序做了哪些處置；不猜原因。<span class="jp"> 場所、設備、確認した変化、手順に従って行った対応を伝え、原因を決めつけません。</span></p></details></section></div>`}

$('#ruby-toggle').addEventListener('click',()=>{S.ruby=!S.ruby;save();applyPreferences()});$('#language-toggle').addEventListener('click',()=>{S.dual=!S.dual;save();applyPreferences()});
document.addEventListener('click',e=>{const b=e.target.closest('button,a[data-go],[data-part]');if(!b||b.disabled)return;
 if(b.dataset.go){e.preventDefault();go(b.dataset.go)}
 else if(b.dataset.part)setPart(Number(b.dataset.part));
 else if(b.dataset.term)showTerm(Number(b.dataset.term));
 else if(b.dataset.known)toggleKnown(Number(b.dataset.known));
 else if(b.dataset.close)document.getElementById(b.dataset.close).close();
 else if(b.dataset.seek!==undefined)openVideo(b.dataset.seek,b.dataset.videoTitle);
 else if(b.dataset.cat){termCategory=b.dataset.cat;render()}
 else if(b.dataset.stage){stageId=Number(b.dataset.stage);render()}
 else if(b.dataset.lab){lab=b.dataset.lab;render()}
 else if(b.dataset.stagger){stagger=b.dataset.stagger==='true';render()}
 else if(b.dataset.scene){sceneId=Number(b.dataset.scene);render()}
 else if(b.dataset.practice){practice=b.dataset.practice;if(practice!=='both'){S.dual=true;save()}render()}
 else if(b.dataset.quizMode){quizMode=b.dataset.quizMode;quizIndex=0;render()}
 else if(b.dataset.question!==undefined){quizIndex=Number(b.dataset.question);render()}
 else if(b.dataset.answer!==undefined){const q=(quizMode==='beginner'?D.beginner:D.quizzes)[quizIndex];if(S.answers[q.id]!==undefined)return;S.answers[q.id]=Number(b.dataset.answer);save();render()}
 else if(b.dataset.chapter){archiveChapter=b.dataset.chapter;archivePage=0;render()}
 else if(b.dataset.page!==undefined){archivePage=Number(b.dataset.page);renderArchiveList();$('#archive-list').scrollIntoView({block:'start'})}
 else if(b.dataset.action==='clear-terms'){termCategory='all';termSearch='';termTier='all';knownOnly=false;render()}
 else if(b.dataset.action==='known-only'){knownOnly=!knownOnly;render()}
 else if(b.dataset.action==='export-terms')exportTerms();
 else if(b.dataset.action==='export-progress'){download('潛盾學習紀錄.json',JSON.stringify({lesson:D.version,exportedAt:new Date().toISOString(),knownTerms:S.known,answers:S.answers},null,2),'application/json');toast('學習紀錄已下載')}
 else if(b.dataset.action==='retry-question'){const q=(quizMode==='beginner'?D.beginner:D.quizzes)[quizIndex];delete S.answers[q.id];save();render()}
});
document.addEventListener('input',e=>{if(e.target.id==='term-search'){termSearch=e.target.value;renderTermGrid()}else if(e.target.id==='archive-search'){archiveSearch=e.target.value;archivePage=0;renderArchiveList()}else if(e.target.id==='pressure-slider'){pressure=Number(e.target.value);renderLabGraphic()}else if(e.target.id==='grout-slider'){grout=Number(e.target.value);renderLabGraphic()}});
document.addEventListener('change',e=>{if(e.target.id==='term-tier'){termTier=e.target.value;renderTermGrid()}else if(e.target.id==='archive-chapter'){archiveChapter=e.target.value;archivePage=0;render()}});
document.addEventListener('keydown',e=>{const p=e.target.closest('[data-part]');if(p&&(e.key==='Enter'||e.key===' ')){e.preventDefault();setPart(Number(p.dataset.part))}});
$('#main-nav').innerHTML=routes.map(([id,name,ic])=>`<a class="nav-link" href="#${id}" data-go="${id}" title="${name}">${icon(ic)}<span>${name}</span></a>`).join('');
window.addEventListener('hashchange',()=>{if(routes.some(r=>r[0]===location.hash.slice(1)))go(location.hash.slice(1))});view=routes.some(r=>r[0]===location.hash.slice(1))?location.hash.slice(1):'home';render();
</script></body></html>
